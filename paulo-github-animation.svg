<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title description">
  <title id="title">Paulo Malpice Sêmpio Neto</title>
  <desc id="description">Animated blue technology-themed GitHub profile header reading Building reliable software systems.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06182d"/>
      <stop offset="0.48" stop-color="#0a3c78"/>
      <stop offset="1" stop-color="#0b63bd"/>
      <animate attributeName="x1" values="0;120;0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1280;1160;1280" dur="16s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="ambientLight" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#21a9ff" stop-opacity="0.2"/>
      <stop offset="0.65" stop-color="#0b67c5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#020b16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveFront" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063a6c"/>
      <stop offset="0.5" stop-color="#032e59"/>
      <stop offset="1" stop-color="#041d38"/>
    </linearGradient>

    <linearGradient id="waveBack" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a8e0" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#1674d1" stop-opacity="0.35"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8bd7ff" stroke-width="1" stroke-opacity="0.075"/>
      <animate attributeName="x" values="0;44" dur="20s" repeatCount="indefinite"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#01070e" flood-opacity="0.45"/>
    </filter>

    <clipPath id="cardClip">
      <rect width="1280" height="280" rx="18"/>
    </clipPath>

    <style>
      .data-flow {
        stroke-dasharray: 10 90;
        animation: dataFlow 7s linear infinite;
      }
      .title-text {
        animation: reveal 900ms cubic-bezier(.2,.75,.25,1) both;
      }
      .subtitle-text {
        animation: reveal 900ms 160ms cubic-bezier(.2,.75,.25,1) both;
      }
      @keyframes dataFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .data-flow, .title-text, .subtitle-text { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="280" fill="url(#background)"/>
    <rect width="1280" height="280" fill="url(#ambientLight)"/>
    <rect width="1280" height="280" fill="url(#grid)"/>

    <!-- Discreet circuit geometry -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 76H118L154 112H266" stroke="#40bdff" stroke-opacity="0.28" stroke-width="1.5"/>
      <path d="M1014 58H1114L1150 94H1280" stroke="#5dcaff" stroke-opacity="0.3" stroke-width="1.5"/>
      <path d="M0 174H86L122 138H220" stroke="#2faeff" stroke-opacity="0.2" stroke-width="1.5"/>
      <path d="M1058 156H1164L1200 120H1280" stroke="#48bfff" stroke-opacity="0.24" stroke-width="1.5"/>

      <path class="data-flow" pathLength="100" d="M0 76H118L154 112H266" stroke="#7cddff" stroke-width="2.2" filter="url(#softGlow)"/>
      <path class="data-flow" pathLength="100" d="M1014 58H1114L1150 94H1280" stroke="#81ddff" stroke-width="2.2" filter="url(#softGlow)" style="animation-delay:-3.5s"/>
    </g>

    <!-- Pulsing circuit nodes -->
    <g fill="#8ce4ff" filter="url(#softGlow)">
      <circle cx="154" cy="112" r="3">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1114" cy="58" r="3">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="122" cy="138" r="2.6" opacity="0.55"/>
      <circle cx="1200" cy="120" r="2.6" opacity="0.5"/>
    </g>

    <!-- Identity -->
    <g text-anchor="middle" filter="url(#textShadow)">
      <text class="title-text" x="640" y="126" fill="#f8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.2">
        Paulo Malpice Sêmpio Neto
      </text>
      <text class="subtitle-text" x="640" y="174" fill="#d6efff" font-family="JetBrains Mono, Consolas, monospace" font-size="20" font-weight="500" letter-spacing="1.4">
        Building reliable software systems
      </text>
    </g>

    <!-- Layered waves inspired by the reference, kept subtle -->
    <path fill="url(#waveBack)" d="M0 232C174 258 342 254 500 242C690 227 842 221 1010 226C1118 229 1207 224 1280 212V280H0Z">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" values="
        M0 232C174 258 342 254 500 242C690 227 842 221 1010 226C1118 229 1207 224 1280 212V280H0Z;
        M0 222C172 240 334 264 510 248C682 232 852 214 1014 222C1124 228 1212 240 1280 230V280H0Z;
        M0 232C174 258 342 254 500 242C690 227 842 221 1010 226C1118 229 1207 224 1280 212V280H0Z"/>
    </path>
    <path fill="url(#waveFront)" d="M0 248C208 264 362 269 540 256C716 243 872 238 1020 241C1120 243 1208 249 1280 260V280H0Z">
      <animate attributeName="d" dur="18s" repeatCount="indefinite" values="
        M0 248C208 264 362 269 540 256C716 243 872 238 1020 241C1120 243 1208 249 1280 260V280H0Z;
        M0 258C204 270 366 257 534 249C710 241 868 248 1022 252C1124 255 1212 250 1280 242V280H0Z;
        M0 248C208 264 362 269 540 256C716 243 872 238 1020 241C1120 243 1208 249 1280 260V280H0Z"/>
    </path>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="278.5" rx="17.25" fill="none" stroke="#67cfff" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
